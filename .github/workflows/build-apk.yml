name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Preparar Android SDK
        continue-on-error: true
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK em: $SDK"
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          echo "sdkmanager: $SM"
          for J in "$JAVA_HOME_21_X64" "$JAVA_HOME"; do
            [ -n "$J" ] || continue
            if yes | JAVA_HOME="$J" "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1; then
              echo "licencas aceitas com $J"
              JAVA_HOME="$J" "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
              break
            fi
          done
      - name: Compilar
        shell: bash
        run: |
          if ls *.zip >/dev/null 2>&1; then
            mkdir fonte
            unzip -q "$(ls *.zip | head -1)" -d fonte
            RAIZ=fonte
          else
            RAIZ=.
          fi
          S=$(find "$RAIZ" -name settings.gradle.kts | head -1)
          [ -n "$S" ] || { echo "settings.gradle.kts não encontrado"; exit 1; }
          cd "$(dirname "$S")"
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZSFiles-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
